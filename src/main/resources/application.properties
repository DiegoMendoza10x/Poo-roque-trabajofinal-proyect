# ============================================================
#  SISTEMA DE GESTIÓN DE ALQUILERES DE DEPARTAMENTOS
#  Base de datos por defecto: H2 embebida (no requiere instalar)
# ============================================================
db.url=jdbc:h2:~/SysAlquileres/data/alquileres;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
db.username=sa
db.password=
db.ddl.auto=true
db.ddl.script=schema.sql
db.seed.demo=true

# ============================================================
#  PARA USAR SUPABASE (PostgreSQL en la nube)
#
#  1. Crea el proyecto en https://supabase.com
#  2. En el SQL Editor ejecuta el archivo: database/supabase_schema.sql
#  3. Copia la cadena de conexión (Project Settings > Database >
#     Connection string > Session pooler) y conviértela a JDBC:
#
#     postgresql://postgres.xxxx:PASSWORD@aws-0-sa-east-1.pooler.supabase.com:6543/postgres
#     ↓
#     jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require
#
#  4. OPCIÓN A (recomendada): usa variables de entorno y NO escribas
#     la clave en este archivo:
#        $env:SUPABASE_DB_URL="jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres"
#        $env:SUPABASE_DB_USER="postgres.xxxxxxxxxxxx"
#        $env:SUPABASE_DB_PASSWORD="tu-clave"
#        $env:SUPABASE_DDL_AUTO="false"
#        $env:SUPABASE_SEED_DEMO="false"
#
#  5. OPCIÓN B: descomenta y edita estas líneas (cuidado de no subir
#     la clave a GitHub):
# ============================================================
#db.url=jdbc:postgresql://aws-0-sa-east-1.pooler.supabase.com:6543/postgres?sslmode=require
#db.username=postgres.xxxxxxxxxxxx
#db.password=tu-clave
#db.ddl.auto=false
#db.seed.demo=false

# ============================================================
#  PARA USAR POSTGRESQL LOCAL:
#  1. Crea la base de datos:  CREATE DATABASE alquileres;
#  2. Ejecuta database/postgresql_sistema_alquileres.sql
#  3. Descomenta y ajusta estas líneas:
# ============================================================
#db.url=jdbc:postgresql://localhost:5432/alquileres
#db.username=postgres
#db.password=postgres
#db.ddl.auto=false
