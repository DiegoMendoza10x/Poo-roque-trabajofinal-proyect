plugins {
    id 'com.android.application'
}

android {
    namespace 'pe.edu.upeu.alquileres.movil'
    compileSdk 35

    defaultConfig {
        applicationId 'pe.edu.upeu.alquileres.movil'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
