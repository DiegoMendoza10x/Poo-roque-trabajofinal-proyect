<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071024"/>
      <stop offset="0.45" stop-color="#12275a"/>
      <stop offset="0.75" stop-color="#1E3A8A"/>
      <stop offset="1" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60A5FA" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#0B1B3A" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDE68A"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </linearGradient>
    <radialGradient id="brillo" cx="0.7" cy="0.25" r="0.5">
      <stop offset="0" stop-color="#93C5FD" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#93C5FD" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombras" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#cielo)"/>
  <rect width="1600" height="900" fill="url(#brillo)"/>

  <!-- luces distantes / ciudad -->
  <g opacity="0.5" fill="#93C5FD">
    <circle cx="120" cy="120" r="2"/><circle cx="240" cy="200" r="1.6"/><circle cx="360" cy="90" r="2.2"/>
    <circle cx="520" cy="160" r="1.4"/><circle cx="700" cy="80" r="2"/><circle cx="880" cy="150" r="1.5"/>
    <circle cx="1040" cy="60" r="2"/><circle cx="1220" cy="130" r="1.8"/><circle cx="1400" cy="90" r="2.2"/>
    <circle cx="1520" cy="180" r="1.5"/>
  </g>

  <!-- edificios al fondo -->
  <g fill="#0A1B3D" opacity="0.75">
    <rect x="60" y="520" width="150" height="380"/>
    <rect x="230" y="470" width="120" height="430"/>
    <rect x="370" y="560" width="170" height="340"/>
    <rect x="560" y="500" width="130" height="400"/>
    <rect x="710" y="550" width="180" height="350"/>
    <rect x="910" y="480" width="140" height="420"/>
    <rect x="1070" y="540" width="170" height="360"/>
    <rect x="1260" y="500" width="150" height="400"/>
    <rect x="1430" y="560" width="170" height="340"/>
  </g>

  <!-- edificio principal a la derecha -->
  <g transform="translate(940 150)">
    <ellipse cx="230" cy="700" rx="240" ry="26" fill="#000" opacity="0.35" filter="url(#sombras)"/>
    <rect x="40" y="40" width="440" height="650" rx="10" fill="#E6EDF7"/>
    <rect x="40" y="40" width="440" height="650" rx="10" fill="none" stroke="#94A3B8" stroke-width="3"/>
    <rect x="62" y="62" width="396" height="606" fill="#0F172A" opacity="0.08"/>
    <!-- ventanas -->
    <g fill="url(#vidrio)" stroke="#BFDBFE" stroke-width="2">
      <rect x="70" y="80" width="86" height="70" rx="4"/><rect x="177" y="80" width="86" height="70" rx="4"/><rect x="284" y="80" width="86" height="70" rx="4"/><rect x="391" y="80" width="60" height="70" rx="4"/>
      <rect x="70" y="190" width="86" height="70" rx="4"/><rect x="177" y="190" width="86" height="70" rx="4"/><rect x="284" y="190" width="86" height="70" rx="4"/><rect x="391" y="190" width="60" height="70" rx="4"/>
      <rect x="70" y="300" width="86" height="70" rx="4"/><rect x="177" y="300" width="86" height="70" rx="4"/><rect x="284" y="300" width="86" height="70" rx="4"/><rect x="391" y="300" width="60" height="70" rx="4"/>
      <rect x="70" y="410" width="86" height="70" rx="4"/><rect x="177" y="410" width="86" height="70" rx="4"/><rect x="284" y="410" width="86" height="70" rx="4"/><rect x="391" y="410" width="60" height="70" rx="4"/>
      <rect x="70" y="520" width="86" height="70" rx="4"/><rect x="177" y="520" width="86" height="70" rx="4"/><rect x="284" y="520" width="86" height="70" rx="4"/><rect x="391" y="520" width="60" height="70" rx="4"/>
    </g>
    <!-- luces encendidas -->
    <g fill="url(#luz)" opacity="0.9">
      <rect x="70" y="190" width="86" height="70" rx="4"/><rect x="284" y="80" width="86" height="70" rx="4"/>
      <rect x="177" y="300" width="86" height="70" rx="4"/><rect x="391" y="410" width="60" height="70" rx="4"/>
      <rect x="70" y="520" width="86" height="70" rx="4"/><rect x="284" y="520" width="86" height="70" rx="4"/>
    </g>
    <!-- balcones -->
    <g stroke="#CBD5E1" stroke-width="4" fill="none">
      <path d="M62 172 H440"/><path d="M62 282 H440"/><path d="M62 392 H440"/><path d="M62 502 H440"/><path d="M62 612 H440"/>
    </g>
    <!-- puerta -->
    <rect x="196" y="600" width="76" height="90" fill="#1E3A8A"/>
    <circle cx="258" cy="647" r="4" fill="#FDE68A"/>
  </g>

  <!-- calle y farolas -->
  <rect x="0" y="800" width="1600" height="100" fill="#050B18"/>
  <g stroke="#64748B" stroke-width="6">
    <path d="M130 800 V660"/><path d="M420 800 V700"/><path d="M720 800 V650"/>
  </g>
  <g fill="#FDE68A" opacity="0.9">
    <circle cx="130" cy="655" r="10"/><circle cx="420" cy="695" r="8"/><circle cx="720" cy="645" r="10"/>
  </g>
  <g fill="#FDE68A" opacity="0.12">
    <circle cx="130" cy="655" r="34"/><circle cx="720" cy="645" r="34"/>
  </g>
</svg>
