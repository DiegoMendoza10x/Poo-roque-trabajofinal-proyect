<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8FAFC"/><stop offset="1" stop-color="#DBEAFE"/>
    </linearGradient>
    <linearGradient id="cuerpo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="azul" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563EB"/><stop offset="1" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.28"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#fondo)" rx="28"/>
  <circle cx="120" cy="110" r="60" fill="#BFDBFE" opacity="0.55"/>
  <circle cx="700" cy="500" r="90" fill="#93C5FD" opacity="0.35"/>

  <!-- impresora -->
  <g filter="url(#sombra)">
    <path d="M190 360 L240 250 H560 L610 360 Z" fill="url(#cuerpo)" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="170" y="350" width="460" height="150" rx="22" fill="url(#cuerpo)" stroke="#CBD5E1" stroke-width="3"/>
    <rect x="210" y="300" width="380" height="70" rx="16" fill="url(#azul)"/>
    <rect x="250" y="318" width="300" height="12" rx="6" fill="#0B1B3A" opacity="0.55"/>
    <circle cx="560" cy="445" r="14" fill="#16A34A"/>
    <circle cx="600" cy="445" r="9" fill="#94A3B8"/>
  </g>

  <!-- papel saliendo -->
  <g>
    <path d="M300 355 Q400 300 500 355 L500 200 Q400 170 300 200 Z" fill="#FFFDF6" stroke="#CBD5E1" stroke-width="2"/>
    <g stroke="#94A3B8" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <path d="M330 230 H470"/><path d="M330 255 H450"/><path d="M330 280 H470"/><path d="M330 305 H420"/>
    </g>
    <rect x="330" y="325" width="140" height="8" fill="#2563EB" opacity="0.65"/>
  </g>

  <!-- símbolo Bluetooth -->
  <g transform="translate(640 170)">
    <circle r="62" fill="#DBEAFE"/>
    <path d="M0 -34 V34 L-24 12 L24 -12 L0 -34 Z M0 -34 L24 -12 L0 12 V-34 M0 12 L-24 34 L0 34" fill="none" stroke="#2563EB" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M-38 -18 A42 42 0 0 0 -38 18 M38 -18 A42 42 0 0 1 38 18" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- línea de conexión -->
  <path d="M560 240 Q600 210 610 190" fill="none" stroke="#60A5FA" stroke-width="4" stroke-dasharray="9 8"/>
</svg>
